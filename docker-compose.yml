

services:
  postgres:
    image: postgres:15
    container_name: aifinance-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aifinancedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: aifinance-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
